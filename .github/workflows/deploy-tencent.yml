# 推送 main 后把静态文件同步到腾讯云服务器（GitHub Pages 照常发布，两边内容一致）。
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   DEPLOY_HOST     服务器地址
#   DEPLOY_USER     登录用户（如 deploy）
#   DEPLOY_SSH_KEY  该用户的 SSH 私钥（单独生成一把，只用于部署）
#   DEPLOY_PATH     站点目录，可选，默认 /var/www/talekiln
# 没配 DEPLOY_HOST 时整个任务跳过，不会报错。
name: deploy-tencent

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "DEPLOY_HOST 未配置，跳过部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - name: Rsync to server
        if: steps.check.outputs.skip != 'true'
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'deploy' --exclude 'README.md' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH:-/var/www/talekiln}/"
